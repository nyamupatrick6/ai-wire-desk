name: Update AI Wire Desk

on:
  schedule:
    # Runs roughly every 20 minutes. GitHub Actions cron is best-effort,
    # not exact-to-the-minute, especially at busy times.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: ai-wire-desk-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_report.py

      - name: Commit and push if changed
        run: |
          git config user.name "ai-wire-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/archive/
          git diff --staged --quiet || git commit -m "Update report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
